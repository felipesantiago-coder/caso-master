name: Limpeza de deploys da Vercel

# Apos cada push na main (deploy automatico na Vercel), aguarda o novo
# deploy ficar READY e remove todos os deploys antigos, mantendo apenas
# o atual e o anterior.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-cleanup
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aguarda o novo deploy de producao ficar pronto
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_JBQ410YZuVgtWSPfARCMt0ziR4HJ
          COMMIT_SHA: ${{ github.sha }}
        run: node .github/scripts/vercel-wait-deploy.mjs

      - name: Remove deploys antigos (mantem atual e anterior)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_JBQ410YZuVgtWSPfARCMt0ziR4HJ
        run: node .github/scripts/vercel-cleanup.mjs
